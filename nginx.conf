server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API traffic is proxied to the backend service on the same origin.
  # "backend" resolves to the compose service name locally and to the
  # Kubernetes Service name inside the cluster.
  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback so client-side routes (/login, /orders, ...) return index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
